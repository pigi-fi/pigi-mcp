# Publish server.json to the official MCP registry.
#
# Runs on every v* tag (and by hand via workflow_dispatch). Authenticates with
# GitHub Actions OIDC, which grants the io.github.pigi-fi/* namespace from the
# repo's identity — no personal login required.
#
# The registry refuses to overwrite an existing version, so the tag must match
# the "version" field in server.json (checked below) and every republish needs
# a bump there first. After a successful publish the same tag gets a GitHub
# Release (directories such as Glama score listings on having releases).

name: Publish to MCP registry

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # create the GitHub Release
  id-token: write   # registry OIDC login

env:
  MCP_PUBLISHER_VERSION: v1.8.1

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches server.json version
        if: github.ref_type == 'tag'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest="$(jq -r .version server.json)"
          if [ "$tag" != "$manifest" ]; then
            echo "::error::tag v$tag does not match server.json version $manifest"
            exit 1
          fi

      - name: Install mcp-publisher
        run: |
          curl -sSfL \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz" \
            | tar xz mcp-publisher
          sudo mv mcp-publisher /usr/local/bin/
          mcp-publisher --version

      - name: Validate server.json
        run: mcp-publisher validate

      - name: Login (GitHub OIDC)
        run: mcp-publisher login github-oidc

      - name: Publish
        run: mcp-publisher publish

      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 && exit 0
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes "Published to the MCP registry as io.github.pigi-fi/pigi-mcp ${GITHUB_REF_NAME#v}. Endpoint: https://mcp.pigi.finance/api/mcp"
