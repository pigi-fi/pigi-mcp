# Publish server.json to the official MCP registry.
#
# Runs on every v* tag (and by hand via workflow_dispatch). Authenticates with
# GitHub Actions OIDC, which grants the io.github.pigi-fi/* namespace from the
# repo's identity — no personal login required.
#
# The registry refuses to overwrite an existing version, so the tag must match
# the "version" field in server.json (checked below) and every republish needs
# a bump there first.

name: Publish to MCP registry

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  MCP_PUBLISHER_VERSION: v1.8.1

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches server.json version
        if: github.ref_type == 'tag'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest="$(jq -r .version server.json)"
          if [ "$tag" != "$manifest" ]; then
            echo "::error::tag v$tag does not match server.json version $manifest"
            exit 1
          fi

      - name: Install mcp-publisher
        run: |
          curl -sSfL \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz" \
            | tar xz mcp-publisher
          sudo mv mcp-publisher /usr/local/bin/
          mcp-publisher --version

      - name: Validate server.json
        run: mcp-publisher validate

      - name: Login (GitHub OIDC)
        run: mcp-publisher login github-oidc

      - name: Publish
        run: mcp-publisher publish
